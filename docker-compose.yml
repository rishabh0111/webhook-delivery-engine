# Local development / test dependencies: Postgres + Redis.
#
#   docker compose up -d
#   DATABASE_URL=postgres://postgres:postgres@localhost:5432/webhooks npm run migrate
#
# Redis mirrors the production target: a MEMORY-metered tier with
# maxmemory-policy=noeviction (NOT command-metered — an idle BullMQ worker
# emits millions of commands/month, which exhausts command-metered free tiers;
# noeviction is required or BullMQ silently loses keys).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: webhooks
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d webhooks"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30